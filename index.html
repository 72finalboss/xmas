<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree Animation</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-weight: bold;
            font-size: 1.2rem;
        }
        pre {
            white-space: pre; 
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <pre id="canvas"></pre>

<script>
    // --- 1. CONFIGURATION ---
    
    // UPDATED: This now matches YOUR specific tree structure
    const treeRaw = `
             *
            / \\
           /*O*\\
          /*****\\
         /**O****\\
        /******O**\\
       /**O********\\
      /*********O***\\
     /****O**********\\
    /*********O***O***\\
          |_____|
          |_____|
    `;

    // Colors
    const GREEN_STYLE = 'color: #2ecc71;';
    const YELLOW_STYLE = 'color: #f1c40f;';
    const BROWN_STYLE = 'color: #d35400;';
    const WHITE_STYLE = 'color: #ffffff;';
    
    const ORNAMENT_COLORS = ['#e74c3c', '#3498db', '#9b59b6', '#1abc9c', '#ffffff'];

    // Symbols
    const SLEDGE_EMOJI = "🛷";
    const REINDEER_EMOJI = "🦌";
    const SNOW_CHAR = ".";
    const TRAIL_CHAR = "=";

    // Movement
    let sledPos = -10;
    const width = 50; 

    function colorize(text, style) {
        return `<span style="${style}">${text}</span>`;
    }

    // --- 2. ANIMATION LOOP ---
    function animate() {
        // Use trim() to remove the first newline, but split ensures we keep structure
        const lines = treeRaw.replace(/^\s*\n/, "").replace(/\s*$/, "").split('\n');
        let output = "";

        // --- PART A: PROCESS TREE & SNOW ---
        lines.forEach(line => {
            // Pad line to 50 chars
            let paddedLine = line.padEnd(width, " ");
            let processedLine = "";

            for (let char of paddedLine) {
                if (char === 'O') {
                    let randomColor = ORNAMENT_COLORS[Math.floor(Math.random() * ORNAMENT_COLORS.length)];
                    processedLine += colorize("O", `color: ${randomColor}`);
                } 
                else if (['*', '/', '\\'].includes(char)) {
                    processedLine += colorize(char, GREEN_STYLE);
                } 
                else if (['|', '_'].includes(char)) {
                    processedLine += colorize(char, BROWN_STYLE);
                } 
                else if (char === ' ') {
                    if (Math.random() < 0.05) {
                        processedLine += colorize(SNOW_CHAR, WHITE_STYLE);
                    } else {
                        processedLine += " ";
                    }
                } 
                else {
                    processedLine += char;
                }
            }
            output += processedLine + "\n";
        });

        // Fix Top Star
        const greenStarHTML = colorize("*", GREEN_STYLE);
        const yellowStarHTML = colorize("*", YELLOW_STYLE);
        output = output.replace(greenStarHTML, yellowStarHTML);

        // --- PART B: PROCESS SLEDGE & REINDEER ---
        let trackLine = new Array(width).fill(" ");

        let rPos = Math.floor(sledPos);     // Reindeer
        let sPos = Math.floor(sledPos) - 1; // Sledge

        // Draw Trail
        for (let i = 1; i <= 5; i++) {
            let tPos = sPos - i;
            if (tPos >= 0 && tPos < width) {
                trackLine[tPos] = colorize(TRAIL_CHAR, WHITE_STYLE);
            }
        }

        // Draw Sledge
        if (sPos >= 0 && sPos < width) trackLine[sPos] = SLEDGE_EMOJI;

        // Draw Reindeer
        if (rPos >= 0 && rPos < width) trackLine[rPos] = REINDEER_EMOJI;

        output += "\n" + trackLine.join("");

        // --- PART C: RENDER ---
        document.getElementById('canvas').innerHTML = output;

        sledPos += 1;
        if (sledPos > width + 5) {
            sledPos = -10;
        }
    }

    setInterval(animate, 150);

</script>
</body>
</html>

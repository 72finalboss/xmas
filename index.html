<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree</title>
    <style>
        body {
            background: #000011; color: #fff;
            font-family: 'Courier New', monospace;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; margin: 0; overflow: hidden; width: 100%;
        }
        #track, #tree { width: 100%; white-space: pre; text-align: center; font-weight: bold; }
        #track { height: 100px; display: flex; justify-content: center; align-items: center; }
        #tree  { font-size: 1.2rem; line-height: 1.2; }
        
        .item { display: inline-block; min-width: 15px; text-align: center; }
        .big  { font-size: 6em; line-height: 1; margin: 0 5px; width: auto; }
        .trail{ color: #ccc; font-size: 1.5rem; opacity: 0.7; }
    </style>
</head>
<body>

    <div id="track"></div>
    <div id="tree"></div>

<script>
    // --- CONFIG ---
    const width = 200;  
    const gapHeight = 10; 
    
    const treeDesign = [
        "          *", "         / \\", "        /*O*\\", "       /*****\\", 
        "      /**O****\\", "     /******O**\\", "    /**O********\\", 
        "   /*********O***\\", "  /****O**********\\", " /*********O***O***\\", 
        "      |_____|", "      |_____|"
    ];

    const lines = [...Array(gapHeight).fill(""), ...treeDesign];
    
    // Center the tree
    const treeWidth = Math.max(...treeDesign.map(l => l.length));
    const startCol  = Math.floor((width - treeWidth) / 2);

    let sledPos = width;
    let ticks = 0;
    
    let snow = Array.from({length: lines.length}, () => Array(width).fill(false));

    const colors = { y: '#f1c40f', g: '#2ecc71', b: '#d35400', w: '#ffffff' };
    const ornaments = ['#e74c3c','#3498db','#9b59b6','#1abc9c','#ffffff'];
    const col = (txt, c, cls='') => `<span class="${cls}" style="color:${c}">${txt}</span>`;

    function render() {
        ticks++;

        // 1. UPDATE SNOW
        if (ticks % 10 === 0) {
            snow = snow.map(row => row.map(() => Math.random() < 0.02));
        }

        // 2. RENDER TREE
        const treeHTML = lines.map((line, y) => {
            let rowHTML = "";
            for (let x = 0; x < width; x++) {
                const charIndex = x - startCol;
                const char = line[charIndex]; 
                
                if (char && char !== ' ') {
                    if (y === gapHeight && char === '*') rowHTML += col(char, colors.y);
                    else if (char === 'O') rowHTML += col('O', ornaments[(Math.floor(ticks/15)+x)%5]);
                    else if ("*/\\".includes(char)) rowHTML += col(char, colors.g);
                    else if ("|_".includes(char))   rowHTML += col(char, colors.b);
                    else rowHTML += char;
                } 
                else {
                    rowHTML += snow[y][x] ? col('.', colors.w) : ' ';
                }
            }
            return `<div>${rowHTML}</div>`;
        }).join('');

        // 3. RENDER TRACK
        let trackHTML = "";
        const r = Math.floor(sledPos); 
        const s = r + 6; // Sledge is 6 spaces after reindeer
        
        for (let x = 0; x < width; x++) {
            if (x === r) {
                trackHTML += col('🦌', '', 'item big');
            }
            else if (x === s) {
                trackHTML += col('🛷', '', 'item big');
            }
            // CHANGE: Trail moved 3 spaces right (starts 6 spaces after Sledge)
            else if (x > s + 6 && x <= s + 11) {
                trackHTML += col(' ~ ', '#ccc', 'item trail');
            }
            else {
                trackHTML += `<span class="item">&nbsp;</span>`;
            }
        }

        document.getElementById('tree').innerHTML = treeHTML;
        document.getElementById('track').innerHTML = trackHTML;

        // Reset when the longer train goes off screen
        sledPos = (sledPos < -40) ? width : sledPos - 0.5;
    }

    setInterval(render, 80);
</script>
</body>
</html>

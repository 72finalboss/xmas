<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree Animation</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; overflow: hidden;
            font-weight: bold; font-size: 1.2rem;
        }
        pre { white-space: pre; line-height: 1.2; margin: 0; }
    </style>
</head>
<body>
    <pre id="canvas"></pre>
<script>
const treeRaw = `
         *
        / \
       /*O*\
      /*****\
     /**O****\
    /******O**\
   /**O********\
  /*********O***\
 /****O**********\
/*********O***O***\
      |_____|
      |_____|
`.trim();

const styles = {
    green: 'color: #2ecc71;',
    yellow: 'color: #f1c40f;',
    brown:  'color: #d35400;',
    white:  'color: #ffffff;',
    ornament: [
        '#e74c3c','#3498db','#9b59b6','#1abc9c','#ffffff'
    ]
};
const EMOJI = {sledge:"🛷", reindeer:"🦌"};
const SNOW = ".", TRAIL = "=";
let sledPos = -10;
const lines = treeRaw.split('\n');
const width = Math.max(...lines.map(l=>l.length), 50);

function color(text, style) {
    return `<span style="${style}">${text}</span>`;
}

function renderTree() {
    return lines.map((line,i) => {
        // Pad all lines
        let padLine = line.padEnd(width, " ");
        let res = "";

        // If top star, color yellow, else treat normally
        for (let j=0; j<padLine.length; j++) {
            let c = padLine[j];
            if (i === 0 && c === '*') res += color(c, styles.yellow);
            else if (c === 'O') {
                const col = styles.ornament[Math.floor(Math.random()*styles.ornament.length)];
                res += color("O", `color:${col}`);
            } else if ("*/\\".includes(c)) res += color(c, styles.green);
            else if ("|_".includes(c)) res += color(c, styles.brown);
            else if (c === " ") res += Math.random()<0.05 ? color(SNOW, styles.white) : " ";
            else res += c;
        }
        return res;
    }).join("\n");
}

function renderTrack() {
    const track = Array(width).fill(" ");
    let r = Math.floor(sledPos), s = r-1;
    for (let i=1; i<=5; i++) {
        let t = s-i; if (t>=0 && t<width) track[t] = color(TRAIL, styles.white);
    }
    if (s>=0 && s<width) track[s] = EMOJI.sledge;
    if (r>=0 && r<width) track[r] = EMOJI.reindeer;
    return "\n" + track.join("");
}

function animate() {
    document.getElementById('canvas').innerHTML = renderTree() + renderTrack();
    sledPos = (sledPos>width+5)?-10:sledPos+1;
}
setInterval(animate, 150);
</script>
</body>
</html>

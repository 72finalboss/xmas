<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree Animation</title>
    <style>
        body {
            /* Dark Blue Background */
            background: #000011;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            margin: 0; 
            flex-direction: column;
        }

        #error-log {
            color: #ff5555;
            background: #220000;
            padding: 10px;
            display: none; /* Hidden unless there is an error */
            border: 1px solid red;
            margin-bottom: 20px;
        }

        #tree-canvas { 
            margin-bottom: 20px; 
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column; 
            align-items: center;    
        }

        .tree-line {
            white-space: pre; 
            height: 1.2em;    
            display: block;
        }

        #track-canvas {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center; 
            height: 150px; 
            width: 100%;
            white-space: nowrap; 
            /* overflow is allowed now to prevent hiding */
        }

        .track-item {
            min-width: 15px; 
            text-align: center;
            display: inline-block;
        }

        .big-item {
            font-size: 6em;
            line-height: 1;
            width: auto; 
            min-width: auto;
            margin: 0 5px; 
        }

        .trail {
            color: #ccc;
            font-size: 1.5rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div id="error-log"></div>

    <div id="tree-canvas"></div>
    <div id="track-canvas"></div>

<script>
// --- ERROR HANDLER (Run this first) ---
window.onerror = function(message, source, lineno, colno, error) {
    const log = document.getElementById('error-log');
    log.style.display = 'block';
    log.innerHTML += `Error: ${message} at line ${lineno}<br>`;
};
</script>

<script>
// --- MAIN SCRIPT ---

const treeRaw = `
          *
         / \\
        /*O*\\
       /*****\\
      /**O****\\
     /******O**\\
    /**O********\\
   /*********O***\\
  /****O**********\\
 /*********O***O***\\
      |_____|
      |_____|
`.trim();

const styles = {
    green: 'color: #2ecc71;',
    yellow: 'color: #f1c40f;',
    brown:  'color: #d35400;',
    white:  'color: #ffffff;',
    ornament: ['#e74c3c','#3498db','#9b59b6','#1abc9c','#ffffff']
};

const EMOJI = {sledge:"🛷", reindeer:"🦌"};
const SNOW = ".";
const TRAIL = " ~ "; 

// 1. Safe Width Logic
const lines = treeRaw.split('\n');
const width = 65; // Hardcoded width to be safe

// 2. Start Position (Middle of screen)
let sledPos = 30;

function color(text, style, extraClass = "") {
    let classAttr = extraClass ? ` class="${extraClass}"` : "";
    return `<span${classAttr} style="${style}">${text}</span>`;
}

function renderTree() {
    try {
        const rows = lines.map((line, i) => {
            let padLine = line.padEnd(width, " ");
            let res = "";
            for (let j = 0; j < padLine.length; j++) {
                let c = padLine[j];
                if (i === 0 && c === '*') res += color(c, styles.yellow);
                else if (c === 'O') {
                    const col = styles.ornament[Math.floor(Math.random() * styles.ornament.length)];
                    res += color("O", `color:${col}`);
                } else if ("*/\\".includes(c)) res += color(c, styles.green);
                else if ("|_".includes(c)) res += color(c, styles.brown);
                else if (c === " ") res += Math.random() < 0.05 ? color(SNOW, styles.white) : " ";
                else res += c;
            }
            return `<div class="tree-line">${res}</div>`;
        });
        return rows.join('');
    } catch(e) {
        console.error("Tree Error", e);
        return "Tree Error";
    }
}

function renderTrack() {
    const track = [];
    
    // SEQUENCE:
    // Reindeer (Leftmost) -> Sledge -> Trail (Rightmost)
    let r = Math.floor(sledPos); 
    let s = r + 1;               
    
    for (let i = 0; i < width; i++) {
        let content = '';
        let classList = 'track-item';

        if (i === r) {
            content = EMOJI.reindeer; 
            classList += ' big-item';
        } else if (i === s) {
            content = EMOJI.sledge; 
            classList += ' big-item';
        } else if (i > s && i <= s + 4) { 
            // Trail is to the right of the sledge
            content = TRAIL;
            classList += ' trail';
        } else {
            content = '&nbsp;'; 
        }
        track.push(`<span class="${classList}">${content}</span>`);
    }
    return track.join('');
}

function animate() {
    const treeEl = document.getElementById('tree-canvas');
    const trackEl = document.getElementById('track-canvas');
    
    if(treeEl) treeEl.innerHTML = renderTree();
    if(trackEl) trackEl.innerHTML = renderTrack();
    
    // Move LEFT (subtracting). Reset if it goes too far left ( < -20)
    sledPos = (sledPos < -20) ? width + 5 : sledPos - 0.5; 
}

// Start animation
setInterval(animate, 80);

</script>
</body>
</html>

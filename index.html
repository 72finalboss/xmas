<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree Animation</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; overflow: hidden;
            font-weight: bold; font-size: 1.2rem;
            flex-direction: column;
        }
        #tree-canvas { white-space: pre; line-height: 1.2; margin: 0; }
        #track-canvas {
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: flex-end;
            height: 140px;  /* Make space for giant emoji! */
            width: 100%;
            margin: 0;
        }
        .big-emoji {
            font-size: 6em;
            line-height: 0.8;
            vertical-align: middle;
        }
        .trail {
            color: #fff;
            font-size: 1.2rem;
        }
        .track-item {
            width: 1.2em;
            text-align: center;
            display: inline-block;
        }
    </style>
</head>
<body>
    <pre id="tree-canvas"></pre>
    <div id="track-canvas"></div>
<script>
const treeRaw = `
         *
        / \
       /*O*\
      /*****\
     /**O****\
    /******O**\
   /**O********\
  /*********O***\
 /****O**********\
/*********O***O***\
      |_____|
      |_____|
`.trim();

const styles = {
    green: 'color: #2ecc71;',
    yellow: 'color: #f1c40f;',
    brown:  'color: #d35400;',
    white:  'color: #ffffff;',
    ornament: [
        '#e74c3c','#3498db','#9b59b6','#1abc9c','#ffffff'
    ]
};
const EMOJI = {sledge:"🛷", reindeer:"🦌"};
const SNOW = ".", TRAIL = "=";
let sledPos = -10;
const lines = treeRaw.split('\n');
const width = Math.max(...lines.map(l=>l.length), 50);

function color(text, style, extraClass = "") {
    let classAttr = extraClass ? ` class="${extraClass}"` : "";
    return `<span${classAttr} style="${style}">${text}</span>`;
}

// Tree stays classic
function renderTree() {
    return lines.map((line, i) => {
        let padLine = line.padEnd(width, " ");
        let res = "";
        for (let j = 0; j < padLine.length; j++) {
            let c = padLine[j];
            if (i === 0 && c === '*') res += color(c, styles.yellow);
            else if (c === 'O') {
                const col = styles.ornament[Math.floor(Math.random() * styles.ornament.length)];
                res += color("O", `color:${col}`);
            } else if ("*/\\".includes(c)) res += color(c, styles.green);
            else if ("|_".includes(c)) res += color(c, styles.brown);
            else if (c === " ") res += Math.random() < 0.05 ? color(SNOW, styles.white) : " ";
            else res += c;
        }
        return res;
    }).join('\n');
}

// Track is now an array of elements for flex rendering!
function renderTrack() {
    const track = [];
    let r = Math.floor(sledPos), s = r-1;
    for (let i = 0; i < width; i++) {
        let content = '';
        let classList = 'track-item';
        if (i === r) {
            content = EMOJI.reindeer;
            classList += ' big-emoji';
        } else if (i === s) {
            content = EMOJI.sledge;
            classList += ' big-emoji';
        } else if (i >= s-5 && i < s) {
            content = TRAIL;
            classList += ' trail';
        } else {
            content = '';
        }
        track.push(`<span class="${classList}">${content}</span>`);
    }
    return track.join('');
}

function animate() {
    document.getElementById('tree-canvas').innerHTML = renderTree();
    document.getElementById('track-canvas').innerHTML = renderTrack();
    sledPos = (sledPos > width + 5) ? -10 : sledPos + 1;
}
setInterval(animate, 150);
</script>
</body>
</html>

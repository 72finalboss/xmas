<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree Animation</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            flex-direction: column;
        }

        #tree-canvas { 
            margin-bottom: 20px; 
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column; 
            align-items: center;    
        }

        .tree-line {
            white-space: pre; 
            height: 1.2em;    
            display: block;
        }

        #track-canvas {
            display: flex;
            flex-direction: row;
            /* CHANGE: Center the track horizontally */
            justify-content: center;
            align-items: center; 
            height: 150px; 
            width: 100%;
            white-space: nowrap; 
            overflow: hidden;
        }

        .track-item {
            min-width: 15px; 
            text-align: center;
            display: inline-block;
        }

        .big-item {
            font-size: 6em;
            line-height: 1;
            width: auto; 
            min-width: auto;
            margin: 0 5px; 
        }

        .trail {
            color: #ccc;
            font-size: 1.5rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div id="tree-canvas"></div>
    <div id="track-canvas"></div>

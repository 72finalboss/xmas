<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree Animation</title>
    <style>
        body {
            background: #000011; /* Dark Blue */
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            margin: 0; 
            flex-direction: column;
            width: 100%;
            overflow: hidden; 
        }

        #tree-canvas { 
            /* Tree is now below the track */
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column; 
            align-items: center;
            width: 100%;
        }

        .tree-line {
            white-space: pre; 
            height: 1.2em;    
            display: block;
            text-align: center;
        }

        #track-canvas {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center; 
            height: 100px; /* Reduced slightly so it fits better with the gap */
            width: 100%;
            white-space: nowrap; 
            margin-bottom: 20px; /* Space between track and snow-sky */
        }

        .track-item {
            min-width: 15px; 
            text-align: center;
            display: inline-block;
        }

        .big-item {
            font-size: 6em;
            line-height: 1;
            width: auto; 
            min-width: auto;
            margin: 0 5px; 
        }

        .trail {
            color: #ccc;
            font-size: 1.5rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div id="track-canvas"></div>
    <div id="tree-canvas"></div>

<script>
// --- CONFIGURATION ---

const treeBody = [
    "          *",
    "         / \\",
    "        /*O*\\",
    "       /*****\\",
    "      /**O****\\",
    "     /******O**\\",
    "    /**O********\\",
    "   /*********O***\\",
    "  /****O**********\\",
    " /*********O***O***\\",
    "      |_____|",
    "      |_____|"
];

// CHANGE: Create 10 empty lines for the "Snow Gap"
const GAP_SIZE = 10;
const gapLines = Array(GAP_SIZE).fill(""); 

// Combine them: [10 Blank Lines] + [Tree Lines]
const lines = gapLines.concat(treeBody);

const styles = {
    green: 'color: #2ecc71;',
    yellow: 'color: #f1c40f;',
    brown:  'color: #d35400;',
    white:  'color: #ffffff;',
    ornament: ['#e74c3c','#3498db','#9b59b6','#1abc9c','#ffffff']
};

const EMOJI = {sledge:"🛷", reindeer:"🦌"};
const SNOW = ".";
const TRAIL = " ~ "; 

// Full screen width simulation
const width = 200; 

// Start exactly at the Right Border
let sledPos = width;

// TIMING COUNTERS
let ornamentTick = 0;
let snowTick = 0;

// CALCULATE GLOBAL OFFSET FOR TREE CENTERING
// We only care about the width of the actual tree part
const maxLineLength = Math.max(...treeBody.map(l => l.length));
const treeStartColumn = Math.floor((width - maxLineLength) / 2);

// Setup initial snow map
let snowMap = [];
for(let r=0; r<lines.length; r++) {
    let row = [];
    for(let c=0; c<width; c++) {
        row.push(false);
    }
    snowMap.push(row);
}

function color(text, style, extraClass = "") {
    let classAttr = extraClass ? ` class="${extraClass}"` : "";
    return `<span${classAttr} style="${style}">${text}</span>`;
}

function renderTree() {
    let htmlOutput = "";
    
    for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        let res = "";
        
        for (let j = 0; j < width; j++) {
            
            // Calculate where we are relative to the tree block
            let treeCharIndex = j - treeStartColumn;

            // Check if we are inside the bounds of the tree string
            if (treeCharIndex >= 0 && treeCharIndex < line.length) {
                let c = line[treeCharIndex]; 

                // CHANGE: Star is now at index 'GAP_SIZE' (10), not 0
                if (i === GAP_SIZE && c === '*') {
                    res += color(c, styles.yellow); 
                } 
                else if (c === 'O') {
                    const colorIndex = (Math.floor(ornamentTick / 15) + j) % styles.ornament.length;
                    res += color("O", `color:${styles.ornament[colorIndex]}`);
                } 
                else if ("*/\\".includes(c)) {
                    res += color(c, styles.green);
                } 
                else if ("|_".includes(c)) {
                    res += color(c, styles.brown);
                } 
                else if (c === " ") {
                    res += (snowMap[i] && snowMap[i][j]) ? color(SNOW, styles.white) : " ";
                } 
                else {
                    res += c;
                }
            } else {
                 // OUTSIDE THE TREE (Snow Area for Gap and Sides)
                 res += (snowMap[i] && snowMap[i][j]) ? color(SNOW, styles.white) : " ";
            }
        }
        htmlOutput += `<div class="tree-line">${res}</div>`;
    }
    return htmlOutput;
}

function renderTrack() {
    let trackHTML = "";
    let r = Math.floor(sledPos); 
    let s = r + 1;               
    
    for (let i = 0; i < width; i++) {
        let content = '';
        let classList = 'track-item';

        if (i === r) {
            content = EMOJI.reindeer; 
            classList += ' big-item';
        } else if (i === s) {
            content = EMOJI.sledge; 
            classList += ' big-item';
        } else if (i > s && i <= s + 4) { 
            content = TRAIL;
            classList += ' trail';
        } else {
            content = '&nbsp;'; 
        }
        trackHTML += `<span class="${classList}">${content}</span>`;
    }
    return trackHTML;
}

function animate() {
    snowTick++;
    if (snowTick % 10 === 0) {
        for(let r=0; r<lines.length; r++) {
            for(let c=0; c<width; c++) {
                // Low density snow for full screen
                snowMap[r][c] = (Math.random() < 0.02);
            }
        }
    }
    
    ornamentTick++;

    const treeEl = document.getElementById('tree-canvas');
    const trackEl = document.getElementById('track-canvas');
    
    if (treeEl) treeEl.innerHTML = renderTree();
    if (trackEl) trackEl.innerHTML = renderTrack();
    
    // Move Reindeer
    if (sledPos < -8) {
        sledPos = width;
    } else {
        sledPos -= 0.5;
    }
}

// Start
setInterval(animate, 80);

</script>
</body>
</html>

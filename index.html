<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree Animation</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            flex-direction: column;
        }

        #tree-canvas { 
            margin-bottom: 20px; 
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column; 
            align-items: center;    
        }

        .tree-line {
            white-space: pre; 
            height: 1.2em;    
            display: block;
        }

        #track-canvas {
            display: flex;
            flex-direction: row;
            /* CHANGE 1: Centralize the track items */
            justify-content: center;
            align-items: center; 
            height: 150px; 
            width: 100%;
            white-space: nowrap; 
            overflow: hidden;
        }

        .track-item {
            min-width: 15px; 
            text-align: center;
            display: inline-block;
        }

        .big-item {
            font-size: 6em;
            line-height: 1;
            width: auto; 
            min-width: auto;
            margin: 0 5px; 
        }

        .trail {
            color: #ccc;
            font-size: 1.5rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div id="tree-canvas"></div>
    <div id="track-canvas"></div>

<script>
const treeRaw = `
          *
         / \\
        /*O*\\
       /*****\\
      /**O****\\
     /******O**\\
    /**O********\\
   /*********O***\\
  /****O**********\\
 /*********O***O***\\
      |_____|
      |_____|
`.trim();

const styles = {
    green: 'color: #2ecc71;',
    yellow: 'color: #f1c40f;',
    brown:  'color: #d35400;',
    white:  'color: #ffffff;',
    ornament: ['#e74c3c','#3498db','#9b59b6','#1abc9c','#ffffff']
};

const EMOJI = {sledge:"🛷", reindeer:"🦌"};
const SNOW = ".", TRAIL = " ~ "; 
const lines = treeRaw.split('\n');
const width = Math.max(...lines.map(l=>l.length), 60);

// CHANGE 2: Start off-screen to the RIGHT
let sledPos = width + 5;

function color(text, style, extraClass = "") {
    let classAttr = extraClass ? ` class="${extraClass}"` : "";
    return `<span${classAttr} style="${style}">${text}</span>`;
}

function renderTree() {
    const rows = lines.map((line, i) => {
        let padLine = line.padEnd(width, " ");
        let res = "";
        for (let j = 0; j < padLine.length; j++) {
            let c = padLine[j];
            if (i === 0 && c === '*') res += color(c, styles.yellow);
            else if (c === 'O') {
                const col = styles.ornament[Math.floor(Math.random() * styles.ornament.length)];
                res += color("O", `color:${col}`);
            } else if ("*/\\".includes(c)) res += color(c, styles.green);
            else if ("|_".includes(c)) res += color(c, styles.brown);
            else if (c === " ") res += Math.random() < 0.05 ? color(SNOW, styles.white) : " ";
            else res += c;
        }
        return `<div class="tree-line">${res}</div>`;
    });
    return rows.join('');
}

function renderTrack() {
    const track = [];
    // CHANGE 4: Reversed Sequence logic for Right-to-Left movement
    // Sledge leads (at current position)
    let s = Math.floor(sledPos); 
    // Reindeer follows (to the right, so +1 index)
    let r = s + 1;               
    
    for (let i = 0; i < width; i++) {
        let content = '';
        let classList = 'track-item';

        if (i === s) {
            content = EMOJI.sledge; // Sledge first
            classList += ' big-item';
        } else if (i === r) {
            content = EMOJI.reindeer; // Reindeer second
            classList += ' big-item';
        } else if (i > r && i <= r + 4) { // Trail follows reindeer (indices to the right)
            content = TRAIL;
            classList += ' trail';
        } else {
            content = '&nbsp;'; 
        }
        track.push(`<span class="${classList}">${content}</span>`);
    }
    return track.join('');
}

function animate() {
    document.getElementById('tree-canvas').innerHTML = renderTree();
    document.getElementById('track-canvas').innerHTML = renderTrack();
    
    // CHANGE 3: Move Right-to-Left (subtract position) and reset when off-screen left
    sledPos = (sledPos < -15) ? width + 5 : sledPos - 0.5; 
}

setInterval(animate, 100);
</script>
</body>
</html>

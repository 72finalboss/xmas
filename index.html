<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree - Last Christmas (MP3)</title>
    <style>
        body {
            background: #000011; color: #fff;
            font-family: 'Courier New', monospace;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh; 
            margin: 0; 
            overflow-x: hidden; 
            overflow-y: auto;   
            width: 100%;
            padding: 20px 0;    
        }

        /* Audio Player Style */
        audio {
            margin-bottom: 20px;
            width: 300px;
            height: 40px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        #track, #tree { width: 100%; white-space: pre; text-align: center; font-weight: bold; }
        #track { height: 100px; display: flex; justify-content: center; align-items: center; }
        #tree  { font-size: 1.2rem; line-height: 1.2; }
        
        #video-gallery {
            margin-top: 40px;
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;
            width: 90%; max-width: 1000px;
        }
        .video-wrapper {
            border: 2px solid #333; border-radius: 10px; overflow: hidden;
            box-shadow: 0 0 20px rgba(255,255,255,0.1); width: 300px;
        }
        video { display: block; width: 100%; height: auto; }

        .item { display: inline-block; min-width: 15px; text-align: center; }
        .big  { font-size: 6em; line-height: 1; margin: 0 5px; width: auto; }
        .trail{ color: #ccc; font-size: 1.5rem; opacity: 0.7; }
        
        /* Lyric Style */
        .lyric-text { 
            text-shadow: 0 0 5px currentColor; 
            font-weight: 900; 
            background: rgba(0,0,0,0.5); 
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="Last Christmas.mp3" controls autoplay loop></audio>

    <div id="track"></div>
    <div id="tree"></div>

    <div id="video-gallery">
        <div class="video-wrapper"><video src="happy-cat.mp4" autoplay loop muted playsinline></video></div>
        <div class="video-wrapper"><video src="dance-cat.mp4" autoplay loop muted playsinline></video></div>
        <div class="video-wrapper"><video src="dance2-cat.mp4" autoplay loop muted playsinline></video></div>
    </div>

<script>
    // --- 2. CONFIGURATION ---
    const width = 200;  
    const totalGapHeight = 10;
    const lyricRowStart = 3; 
    const lyricRowEnd   = 6; 
    const delaySeconds  = 0.5; // <--- The 0.5s Delay Config

    // --- 3. LYRICS DATA (Wham! - Last Christmas) ---
    const lyricsData = [
        { time: 0, text: "..." },
        { time: 17, text: "Last Christmas I gave you my heart" },
        { time: 21, text: "But the very next day you gave it away" },
        { time: 26, text: "This year, to save me from tears" },
        { time: 31, text: "I'll give it to someone special" },
        { time: 35, text: "Last Christmas I gave you my heart" },
        { time: 39, text: "But the very next day you gave it away" },
        { time: 43, text: "You gave it away..." },
        { time: 45, text: "This year, to save me from tears" },
        { time: 49, text: "I'll give it to someone special" },
        
        { time: 68, text: "Once bitten and twice shy" },
        { time: 76, text: "I keep my distance" },
        { time: 78, text: "But you still catch my eye" },
        { time: 80, text: "Tell me baby, do you recognize me?" },
        { time: 85, text: "Well, it's been a year" },
        { time: 87, text: "It doesn't surprise me" },
        
        { time: 90, text: "Happy Christmas" },
        { time: 92, text: "I wrapped it up and sent it" },
        { time: 94, text: "With a note saying 'I love you'" },
        { time: 97, text: "I meant it" },
        { time: 99, text: "Now I know what a fool I've been" },
        { time: 102, text: "But if you kissed me now" },
        { time: 105, text: "I know you'd fool me again" }
    ];

    // --- 4. TREE & ANIMATION SETUP ---
    const treeDesign = [
        "          *", "         / \\", "        /*O*\\", "       /*****\\", 
        "      /**O****\\", "     /******O**\\", "    /**O********\\", 
        "   /*********O***\\", "  /****O**********\\", " /*********O***O***\\", 
        "        |_____|", "        |_____|"
    ];

    const lines = [...Array(totalGapHeight).fill(""), ...treeDesign];
    const treeWidth = Math.max(...treeDesign.map(l => l.length));
    const startCol  = Math.floor((width - treeWidth) / 2);

    let sledPos = width;
    let ticks = 0;
    let snow = Array.from({length: lines.length}, () => Array(width).fill(false));

    const colors = { y: '#f1c40f', g: '#2ecc71', b: '#d35400', w: '#ffffff', lyric: '#ff69b4' };
    const ornaments = ['#e74c3c','#3498db','#9b59b6','#1abc9c','#ffffff'];
    const col = (txt, c, cls='') => `<span class="${cls}" style="color:${c}">${txt}</span>`;

    const audioPlayer = document.getElementById('bg-music');

    // Attempt to force play (Browser might block this until user interaction)
    window.addEventListener('load', () => {
        audioPlayer.play().catch(e => console.log("Autoplay blocked until interaction"));
    });

    function render() {
        ticks++;

        // --- A. GET TIME FROM AUDIO TAG ---
        const curTime = audioPlayer.currentTime;

        // --- B. SYNC LOGIC WITH DELAY ---
        let currentText = "";
        for(let i=0; i<lyricsData.length; i++){
            // We verify if current time is greater than (Lyric Time + Delay)
            if(curTime >= (lyricsData[i].time + delaySeconds)) {
                currentText = lyricsData[i].text;
            }
        }

        // --- C. UPDATE SNOW ---
        if (ticks % 10 === 0) {
            snow = snow.map(row => row.map(() => Math.random() < 0.02));
        }

        // --- D. RENDER TREE ---
        const treeHTML = lines.map((line, y) => {
            let rowHTML = "";
            const isTextLine = (y === lyricRowStart + 1); 
            const lyricStart = Math.floor((width - currentText.length) / 2);

            for (let x = 0; x < width; x++) {
                
                // Draw Lyric
                if (isTextLine && x >= lyricStart && x < lyricStart + currentText.length) {
                    const char = currentText[x - lyricStart];
                    rowHTML += col(char, colors.lyric, 'lyric-text');
                    continue; 
                }

                // Draw Tree
                if (y >= totalGapHeight) {
                    const charIndex = x - startCol;
                    const char = line[charIndex]; 
                    
                    if (char && char !== ' ') {
                        if (y === totalGapHeight && char === '*') rowHTML += col(char, colors.y);
                        else if (char === 'O') rowHTML += col('O', ornaments[(Math.floor(ticks/15)+x)%5]);
                        else if ("*/\\".includes(char)) rowHTML += col(char, colors.g);
                        else if ("|_".includes(char))   rowHTML += col(char, colors.b);
                        else rowHTML += char;
                        continue; 
                    } 
                }

                // Draw Snow
                rowHTML += snow[y][x] ? col('.', colors.w) : ' ';
            }
            return `<div>${rowHTML}</div>`;
        }).join('');

        // --- E. RENDER TRACK ---
        let trackHTML = "";
        const r = Math.floor(sledPos); 
        const s = r + 6; 
        
        for (let x = 0; x < width; x++) {
            if (x === r) trackHTML += col('🦌', '', 'item big');
            else if (x === s) trackHTML += col('🛷', '', 'item big');
            else if (x > s + 6 && x <= s + 11) trackHTML += col(' ~ ', '#ccc', 'item trail');
            else trackHTML += `<span class="item">&nbsp;</span>`;
        }

        document.getElementById('tree').innerHTML = treeHTML;
        document.getElementById('track').innerHTML = trackHTML;

        sledPos = (sledPos < -40) ? width : sledPos - 0.5;
    }

    setInterval(render, 80);
</script>
</body>
</html>
